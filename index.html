<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV エディタ</title>
  <!-- Handsontable 14.6.1 (Filters/DropdownMenu を含む)
       ローカル配置の場合は CDN URL をローカルパスに置き換えてください -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable@14.6.1/dist/handsontable.full.min.css">
  <style>
    :root {
      --bg:         #f0f4f8;
      --surface:    #ffffff;
      --border:     #d0d7e2;
      --primary:    #2563eb;
      --primary-h:  #1d4ed8;
      --danger:     #dc2626;
      --success:    #16a34a;
      --text:       #1e293b;
      --text-muted: #64748b;
      --radius:     8px;
      --shadow:     0 1px 4px rgba(0,0,0,.10);
      --shadow-md:  0 4px 16px rgba(0,0,0,.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Meiryo", "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ═══════════════════════════════════════
       ログイン画面
    ═══════════════════════════════════════ */
    #login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--surface);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
      padding: 40px 36px 32px;
      width: 100%;
      max-width: 380px;
    }
    .login-card .logo {
      text-align: center;
      font-size: 40px;
      margin-bottom: 8px;
    }
    .login-card h2 {
      text-align: center;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 28px;
      color: var(--text);
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .form-group input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
      background: #fff;
    }
    .login-error {
      font-size: 12px;
      color: var(--danger);
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      padding: 8px 12px;
      margin-bottom: 12px;
      display: none;
    }
    .login-error.show { display: block; }
    #btn-login {
      width: 100%;
      margin-top: 8px;
      justify-content: center;
      padding: 10px;
      font-size: 14px;
    }

    /* ═══════════════════════════════════════
       共通ヘッダー
    ═══════════════════════════════════════ */
    #app-header {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 200;
    }
    #app-header.show { display: flex; }
    #app-header h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .user-badge strong { color: var(--text); }
    #app-header .spacer { flex: 1; }

    /* ═══════════════════════════════════════
       ボタン
    ═══════════════════════════════════════ */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: var(--radius);
      border: none;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-h); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover:not(:disabled) { background: #15803d; }
    .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
    .btn-outline:hover:not(:disabled) { background: #eff6ff; }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--bg); color: var(--text); }

    /* ═══════════════════════════════════════
       メイン
    ═══════════════════════════════════════ */
    #main {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }
    #main.show { display: flex; }

    /* ═══════════════════════════════════════
       ファイル選択画面
    ═══════════════════════════════════════ */
    #select-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }
    #select-screen h2 { font-size: 15px; color: var(--text-muted); }
    #file-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 540px;
    }
    .file-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
      user-select: none;
    }
    .file-card:hover { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .file-card.selected { border-color: var(--primary); background: #eff6ff; }
    .file-card-icon { font-size: 24px; flex-shrink: 0; }
    .file-card-body { flex: 1; min-width: 0; }
    .file-card-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-card-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-card-id { font-size: 11px; background: #e0e7ff; color: #3730a3; border-radius: 4px; padding: 2px 7px; flex-shrink: 0; font-family: monospace; }
    .file-card.selected .file-card-id { background: var(--primary); color: #fff; }
    #btn-open-selected { min-width: 200px; justify-content: center; }

    /* ═══════════════════════════════════════
       テーブルツールバー
    ═══════════════════════════════════════ */
    #table-toolbar {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }
    #table-toolbar.visible { display: flex; }
    .row-delete-group {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 4px;
    }
    #delete-row-number {
      width: 84px;
      padding: 7px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 13px;
      font-family: inherit;
      color: var(--text);
      background: #fff;
    }
    #delete-row-number:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.15);
    }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    #row-info { font-size: 12px; color: var(--text-muted); margin-left: auto; }

    /* ═══════════════════════════════════════
       テーブルラッパー
    ═══════════════════════════════════════ */
    #table-wrapper {
      display: none;
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      min-height: 400px;
    }
    #table-wrapper.visible { display: block; }
    #hot-container { width: 100%; height: 100%; }

    /* ═══════════════════════════════════════
       ステータスバー
    ═══════════════════════════════════════ */
    #status-bar {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: var(--radius);
      display: none;
    }
    #status-bar.show { display: inline-block; }
    #status-bar.info    { background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; }
    #status-bar.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; }
    #status-bar.error   { background: #fef2f2; color: var(--danger);  border: 1px solid #fecaca; }

    /* ═══════════════════════════════════════
       ローディング
    ═══════════════════════════════════════ */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,.75);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      font-size: 14px;
      color: var(--text-muted);
    }
    #loading.show { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Handsontable */
    .htDimmed { color: #94a3b8 !important; background: #f8fafc !important; }
    td.editable-col { background: #fefce8 !important; }
  </style>
</head>
<body>

<!-- ローディング -->
<div id="loading">
  <div class="spinner"></div>
  <span id="loading-msg">読み込み中...</span>
</div>

<!-- ═══ ログイン画面 ═══ -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo">📊</div>
    <h2>CSV エディタ</h2>
    <div class="login-error" id="login-error"></div>
    <div class="form-group">
      <label>ユーザー名</label>
      <input type="text" id="input-username" autocomplete="username" placeholder="ユーザー名を入力">
    </div>
    <div class="form-group">
      <label>パスワード</label>

    </div>
    <button class="btn btn-primary" id="btn-login" onclick="doLogin()">ログイン</button>
  </div>
</div>

<!-- ═══ アプリヘッダー ═══ -->
<header id="app-header">
  <h1>📊 CSV エディタ</h1>
  <div class="user-badge">
    👤 <strong id="header-display-name"></strong>
  </div>
  <div class="spacer"></div>
  <span id="status-bar"></span>
  <button class="btn btn-ghost" onclick="doLogout()" style="padding:5px 12px;font-size:12px;">ログアウト</button>
</header>

<!-- ═══ メイン ═══ -->
<main id="main">

  <!-- ファイル選択画面 -->
  <div id="select-screen">
    <h2>開くファイルを選択してください</h2>
    <div id="file-list"></div>
    <button class="btn btn-primary" id="btn-open-selected" onclick="onOpenSelected()" disabled>
      &#128194; ファイルを開く
    </button>
  </div>

  <!-- ツールバー -->
  <div id="table-toolbar">
    <button class="btn btn-success" onclick="saveCSV()">💾 保存する</button>
    <button class="btn btn-primary" onclick="addRow()">➕ 行を追加</button>
    <div class="row-delete-group">
      <input type="number" id="delete-row-number" min="1" step="1" placeholder="行番号">
      <button class="btn btn-danger" onclick="deleteRowByNumber()">🗑️ 指定行を削除</button>
    </div>
    <button class="btn btn-outline" onclick="backToSelect()">&#8592; ファイル選択に戻る</button>
    <button class="btn btn-outline" onclick="reloadCSV()">🔄 再読み込み</button>
    <span id="row-info"></span>
  </div>

  <!-- Handsontable -->
  <div id="table-wrapper">
    <div id="hot-container"></div>
  </div>

</main>

<script>
/* =================================================================
   URL 定数
   ================================================================= */
var AUTH_URL     = "auth.py";
var READ_CSV_URL = "read_csv.py";
var SAVE_CSV_URL = "save_csv.py";

/* =================================================================
   アプリ状態
   ================================================================= */
var currentUser    = null;   // { username, display_name, allowed_files }
var selectedFileId = null;
var currentFileId  = null;
var hotInstance    = null;
var csvHeaders     = [];
var csvRows        = [];
var editableColIndexes = [];
var currentConfName = "";
var currentEditableColumns = [];

/* =================================================================
   初期化
   ================================================================= */
document.addEventListener("DOMContentLoaded", function () {
  // Enterキーでログイン
  document.getElementById("input-password").addEventListener("keydown", function (e) {
    if (e.key === "Enter") doLogin();
  });
  document.getElementById("input-username").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("input-password").focus();
  });
  document.getElementById("delete-row-number").addEventListener("keydown", function (e) {
    if (e.key === "Enter") deleteRowByNumber();
  });
});

/* =================================================================
   ログイン
   ================================================================= */
function doLogin() {
  var username = document.getElementById("input-username").value.trim();
  var password = document.getElementById("input-password").value;
  var errEl    = document.getElementById("login-error");

  errEl.classList.remove("show");
  if (!username || !password) {
    errEl.textContent = "ユーザー名とパスワードを入力してください";
    errEl.classList.add("show");
    return;
  }

  var btn = document.getElementById("btn-login");
  btn.disabled = true;
  btn.textContent = "認証中...";

  fetch(AUTH_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json; charset=utf-8" },
    body: JSON.stringify({ username: username, password: password })
  })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    })
    .then(function (data) {
      btn.disabled = false;
      btn.textContent = "ログイン";
      if (!data.success) {
        errEl.textContent = data.error || "ログインに失敗しました";
        errEl.classList.add("show");
        document.getElementById("input-password").value = "";
        return;
      }
      // ログイン成功
      currentUser = data;
      document.getElementById("input-password").value = "";
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("header-display-name").textContent = data.display_name;
      document.getElementById("app-header").classList.add("show");
      document.getElementById("main").classList.add("show");
      buildFileList(data.allowed_files || []);
    })
    .catch(function (err) {
      btn.disabled = false;
      btn.textContent = "ログイン";
      errEl.textContent = "通信エラー: " + err.message;
      errEl.classList.add("show");
    });
}

/* =================================================================
   ログアウト
   ================================================================= */
function doLogout() {
  if (hotInstance) {
    if (!confirm("ログアウトすると編集中の内容が失われます。よいですか？")) return;
    hotInstance.destroy();
    hotInstance = null;
  }
  currentUser = null; selectedFileId = null; currentFileId = null;
  csvHeaders = []; csvRows = []; editableColIndexes = [];

  document.getElementById("table-toolbar").classList.remove("visible");
  document.getElementById("table-wrapper").classList.remove("visible");
  document.getElementById("select-screen").style.display = "";
  document.getElementById("app-header").classList.remove("show");
  document.getElementById("main").classList.remove("show");
  document.getElementById("login-screen").style.display = "";
  document.getElementById("input-username").value = "";
  document.getElementById("input-password").value = "";
  document.getElementById("login-error").classList.remove("show");
  document.getElementById("file-list").innerHTML = "";
  document.getElementById("btn-open-selected").disabled = true;
  document.getElementById("delete-row-number").value = "";
  setStatus("", "");
}

/* =================================================================
   ファイル選択カード生成
   ================================================================= */
function buildFileList(files) {
  var container = document.getElementById("file-list");
  container.innerHTML = "";

  if (files.length === 0) {
    container.innerHTML =
      "<p style='color:var(--text-muted);font-size:13px;text-align:center;'>" +
      "アクセスできるファイルがありません</p>";
    return;
  }

  files.forEach(function (conf) {
    var card = document.createElement("div");
    card.className = "file-card";

    var rEnc = conf.read_encoding  || "utf-8-sig";
    var wEnc = conf.write_encoding || "utf-8-sig";
    var nl   = conf.newline === "\n" ? "LF" : (conf.newline === "\r" ? "CR" : "CRLF");

    card.innerHTML =
      '<div class="file-card-icon">📄</div>' +
      '<div class="file-card-body">' +
        '<div class="file-card-name">' + escHtml(conf.name || conf.id) + '</div>' +
        '<div class="file-card-meta">' +
          '読取: ' + escHtml(rEnc) + '&nbsp;&nbsp;' +
          '書込: ' + escHtml(wEnc) + '&nbsp;&nbsp;' +
          '改行: ' + nl +
        '</div>' +
      '</div>' +
      '<span class="file-card-id">' + escHtml(conf.id) + '</span>';

    card.addEventListener("click", function () {
      document.querySelectorAll(".file-card").forEach(function (c) { c.classList.remove("selected"); });
      card.classList.add("selected");
      selectedFileId = conf.id;
      document.getElementById("btn-open-selected").disabled = false;
    });
    card.addEventListener("dblclick", function () {
      selectedFileId = conf.id;
      onOpenSelected();
    });

    container.appendChild(card);
  });
}

/* =================================================================
   「ファイルを開く」
   ================================================================= */
function onOpenSelected() {
  if (!selectedFileId) return;
  loadCSV(selectedFileId);
}

/* =================================================================
   CSV 読み込み
   ================================================================= */
function loadCSV(fileId) {
  showLoading("CSVを読み込み中...");
  setStatus("", "");
  var pageSize = 1000;
  var offset = 0;
  var allRows = [];
  var headers = [];
  var totalRows = 0;
  var editCols = [];
  var confName = "";

  function fetchPage() {
    var url = READ_CSV_URL +
      "?file_id=" + encodeURIComponent(fileId) +
      "&username=" + encodeURIComponent(currentUser.username) +
      "&offset=" + encodeURIComponent(String(offset)) +
      "&limit=" + encodeURIComponent(String(pageSize));

    return fetch(url, {
      method: "GET",
      headers: { "Cache-Control": "no-cache" }
    })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTPエラー: " + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data.success) throw new Error(data.error || "読み込みエラー");

        if (!headers.length) headers = data.headers || [];
        if (!confName) confName = data.conf_name || "";
        if (!editCols.length) editCols = data.editable_columns || [];
        totalRows = data.total_rows || 0;

        var pageRows = data.rows || [];
        allRows = allRows.concat(pageRows);

        showLoading("CSVを読み込み中... " + allRows.length + " / " + totalRows + " 行");

        if (data.has_more) {
          offset += pageRows.length;
          return fetchPage();
        }
      });
  }

  fetchPage()
    .then(function () {
      hideLoading();
      csvHeaders = headers;
      csvRows = allRows;
      currentFileId = fileId;
      currentConfName = confName;
      currentEditableColumns = editCols;
      document.getElementById("delete-row-number").value = "";

      editableColIndexes = [];
      editCols.forEach(function (col) {
        var i = csvHeaders.indexOf(col);
        if (i >= 0) editableColIndexes.push(i);
      });

      renderTable(currentConfName, currentEditableColumns);
      setStatus(csvRows.length + " / " + totalRows + " 行読み込みました", "success");
    })
    .catch(function (err) {
      hideLoading();
      setStatus("読み込み失敗: " + err.message, "error");
    });
}

/* =================================================================
   再読み込み
   ================================================================= */
function reloadCSV() {
  if (!currentFileId) return;
  if (!confirm("再読み込みすると編集中の内容が失われます。よいですか？")) return;
  loadCSV(currentFileId);
}

/* =================================================================
   ファイル選択に戻る
   ================================================================= */
function backToSelect() {
  if (hotInstance) {
    if (!confirm("ファイル選択に戻ると編集中の内容が失われます。よいですか？")) return;
    hotInstance.destroy();
    hotInstance = null;
  }
  currentFileId = null; selectedFileId = null;
  csvHeaders = []; csvRows = []; editableColIndexes = [];
  currentConfName = ""; currentEditableColumns = [];

  document.getElementById("table-toolbar").classList.remove("visible");
  document.getElementById("table-wrapper").classList.remove("visible");
  document.getElementById("select-screen").style.display = "";
  document.querySelectorAll(".file-card").forEach(function (c) { c.classList.remove("selected"); });
  document.getElementById("btn-open-selected").disabled = true;
  document.getElementById("delete-row-number").value = "";
  setStatus("", "");
}

function getFiltersPlugin() {
  if (!hotInstance) return null;
  return hotInstance.getPlugin("filters") || hotInstance.getPlugin("Filters") || null;
}

/* =================================================================
   Handsontable レンダリング
   ================================================================= */
function renderTable(confName, editCols) {
  if (hotInstance) { hotInstance.destroy(); hotInstance = null; }

  var colSettings = csvHeaders.map(function (h, i) {
    var editable = editableColIndexes.indexOf(i) >= 0;
    return { type: "text", readOnly: !editable, className: editable ? "editable-col" : "" };
  });

  var headerH  = document.getElementById("app-header").offsetHeight  || 52;
  var toolbarH = document.getElementById("table-toolbar").offsetHeight || 48;
  var h = window.innerHeight - headerH - toolbarH - 20 * 2 - 16 * 2;
  if (h < 300) h = 300;
  document.getElementById("hot-container").style.height = h + "px";

  hotInstance = new Handsontable(document.getElementById("hot-container"), {
    data:               csvRows,
    colHeaders:         csvHeaders,
    columns:            colSettings,
    rowHeaders:         true,
    stretchH:           "all",
    manualColumnResize: true,
    viewportRowRenderingOffset: 50,
    copyPaste:          true,
    filters:            true,
    dropdownMenu:       true,
    columnSorting:      true,
    language:           "ja-JP",
    licenseKey:         "non-commercial-and-evaluation",
    outsideClickDeselects: false,

    contextMenu: {
      items: {
        "copy":  { name: "コピー" },
        "cut":   { name: "切り取り" },
        "paste": { name: "貼り付け" },
        "---------": {},
        "filter_column": {
          name: "この列で検索",
          callback: function () {
            var sel = hotInstance.getSelectedLast();
            if (!sel) return;
            var col = sel[1];
            var val = prompt(csvHeaders[col] + " の検索文字列を入力");
            if (val === null) return;
            var f = getFiltersPlugin();
            if (!f) {
              setStatus("フィルタープラグインが利用できません", "error");
              return;
            }
            if (typeof f.clearConditions !== "function" ||
                typeof f.addCondition !== "function" ||
                typeof f.filter !== "function") {
              setStatus("フィルター機能がこの環境では利用できません", "error");
              return;
            }
            f.clearConditions(); f.addCondition(col, "contains", [val]); f.filter();
          }
        },
        "clear_filter": {
          name: "フィルター解除",
          callback: function () {
            var f = getFiltersPlugin();
            if (!f) {
              setStatus("フィルタープラグインが利用できません", "error");
              return;
            }
            if (typeof f.clearConditions !== "function" || typeof f.filter !== "function") {
              setStatus("フィルター機能がこの環境では利用できません", "error");
              return;
            }
            f.clearConditions(); f.filter();
          }
        }
      }
    },

    beforeChange: function (changes) {
      if (!changes) return;
      for (var i = changes.length - 1; i >= 0; i--) {
        if (editableColIndexes.indexOf(changes[i][1]) < 0) changes.splice(i, 1);
      }
    },

    afterChange: function (changes, source) {
      if (!changes || source === "loadData") return;
      changes.forEach(function (ch) {
        var pr = hotInstance.toPhysicalRow(ch[0]);
        if (pr != null) {
          if (!csvRows[pr]) csvRows[pr] = new Array(csvHeaders.length).fill("");
          csvRows[pr][ch[1]] = (ch[3] == null) ? "" : String(ch[3]);
        }
      });
      updateRowInfo(confName, editCols);
    },

    afterCreateRow: function () {
      csvRows = hotInstance.getData();
      updateRowInfo(confName, editCols);
    },

    afterRemoveRow: function () {
      csvRows = hotInstance.getData();
      updateRowInfo(confName, editCols);
    },

    afterOnCellMouseDown: function (event, coords) {
      if (!coords || coords.row !== -1 || coords.col < 0) return;
      if (!event || event.button !== 0) return;
      var target = event.target || event.realTarget;
      if (target && target.closest && target.closest('.changeType')) return;

      var col = coords.col;
      var f = getFiltersPlugin();
      if (!f) return;
      var currentValue = "";
      var conditions = (typeof f.getConditions === 'function') ? f.getConditions(col) : [];
      if (conditions && conditions.length > 0 && conditions[0].name === "contains") {
        currentValue = (conditions[0].args && conditions[0].args[0]) ? String(conditions[0].args[0]) : "";
      }

      var val = prompt(
        csvHeaders[col] + " の検索文字列を入力してください\n" +
        "（空欄でこの列のフィルター解除）",
        currentValue
      );
      if (val === null) return;

      var keyword = val.trim();
      f.removeConditions(col);
      if (keyword) f.addCondition(col, "contains", [keyword]);
      f.filter();
    },

    cells: function (row, col) {
      if (editableColIndexes.indexOf(col) < 0) return { readOnly: true, className: "htDimmed" };
      return {};
    }
  });

  document.getElementById("select-screen").style.display = "none";
  document.getElementById("table-toolbar").classList.add("visible");
  document.getElementById("table-wrapper").classList.add("visible");

  updateRowInfo(confName, editCols);

  window.onresize = function () {
    if (!hotInstance) return;
    var nh = window.innerHeight
      - document.getElementById("app-header").offsetHeight
      - document.getElementById("table-toolbar").offsetHeight
      - 20 * 2 - 16 * 2;
    if (nh < 300) nh = 300;
    document.getElementById("hot-container").style.height = nh + "px";
    hotInstance.render();
  };
}

function updateRowInfo(confName, editCols) {
  var label = confName ? "【" + confName + "】 " : "";
  var ec    = (editCols || []).filter(function (c) { return csvHeaders.indexOf(c) >= 0; });
  document.getElementById("row-info").textContent =
    label + csvHeaders.length + " 列 / " + csvRows.length + " 行" +
    (ec.length > 0 ? "  （編集可能列: " + ec.join(", ") + "）" : "");
}

function addRow() {
  if (!hotInstance) { setStatus("テーブルが読み込まれていません", "error"); return; }
  hotInstance.alter("insert_row_below", hotInstance.countRows() - 1, 1);
  csvRows = hotInstance.getData();
  updateRowInfo(currentConfName, currentEditableColumns);
  setStatus("新しい行を追加しました。編集可能列に値を入力してください。", "success");
}

function deleteRowByNumber() {
  if (!hotInstance) { setStatus("テーブルが読み込まれていません", "error"); return; }

  var input = document.getElementById("delete-row-number");
  var raw = input.value.trim();
  if (!raw) {
    setStatus("削除する行番号を入力してください", "error");
    input.focus();
    return;
  }

  var rowNumber = Number(raw);
  if (!Number.isInteger(rowNumber) || rowNumber < 1) {
    setStatus("行番号は 1 以上の整数で入力してください", "error");
    input.focus();
    return;
  }

  var visualRow = rowNumber - 1;
  if (visualRow >= hotInstance.countRows()) {
    setStatus("指定した行番号が範囲外です（最大 " + hotInstance.countRows() + " 行）", "error");
    input.focus();
    return;
  }

  if (!confirm(rowNumber + " 行目を削除します。よいですか？")) return;

  hotInstance.alter("remove_row", visualRow, 1);
  csvRows = hotInstance.getData();
  updateRowInfo(currentConfName, currentEditableColumns);
  input.value = "";
  setStatus(rowNumber + " 行目を削除しました", "success");
}

/* =================================================================
   CSV 保存
   ================================================================= */
function saveCSV() {
  if (!hotInstance) { setStatus("テーブルが読み込まれていません", "error"); return; }
  if (!confirm("保存しますがよいですか？")) return;

  showLoading("保存中...");
  setStatus("", "");

  var cleanRows = csvRows.map(function (row) {
    return row.map(function (c) { return (c == null) ? "" : String(c); });
  });

  fetch(SAVE_CSV_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json; charset=utf-8" },
    body: JSON.stringify({
      file_id:  currentFileId,
      username: currentUser.username,
      headers:  csvHeaders,
      rows:     cleanRows
    })
  })
    .then(function (res) {
      if (!res.ok) throw new Error("HTTPエラー: " + res.status);
      return res.json();
    })
    .then(function (data) {
      hideLoading();
      if (data.success) {
        setStatus("✓ " + data.message, "success");
      } else {
        setStatus("保存エラー: " + data.error, "error");
      }
    })
    .catch(function (err) {
      hideLoading();
      setStatus("保存失敗: " + err.message, "error");
    });
}

/* =================================================================
   ユーティリティ
   ================================================================= */
function showLoading(msg) {
  document.getElementById("loading-msg").textContent = msg || "処理中...";
  document.getElementById("loading").classList.add("show");
}
function hideLoading() { document.getElementById("loading").classList.remove("show"); }
function setStatus(msg, type) {
  var el = document.getElementById("status-bar");
  el.textContent = msg;
  el.className = "status-bar";
  if (!msg) { el.classList.remove("show"); return; }
  el.classList.add("show");
  if (type) el.classList.add(type);
}
function escHtml(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
